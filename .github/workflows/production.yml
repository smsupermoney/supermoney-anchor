name: Sync GitHub to GitLab

on:
  push:
    branches: ["live"]

jobs:
  sync:
    runs-on: self-hosted

    steps:
      - name: Checkout GitHub Repo
        uses: actions/checkout@v4

      - name: Prepare GitLab Repo
        run: |
          cd /home/github-runner/anchor-actions-runner/anchor

          # Clone if not exists
          if [ ! -d "supermoney-crm-web/.git" ]; then
            git clone git@gitlab.mintwalk.com:ritik/supermoney-anchor-web.git -b live
          fi

          cd supermoney-anchor-web

          # Ensure clean state every time
          git fetch origin
          git reset --hard origin/live
          git clean -fd

      - name: Sync GitHub source to GitLab working directory
        run: |
          rsync -av --delete \
            --exclude='.git' \
            ./ /home/github-runner/anchor-actions-runner/anchor/supermoney-anchor-web/

      - name: Commit and Push to GitLab
        run: |
          cd /home/github-runner/anchor-actions-runner/anchor/supermoney-anchor-web

          git config user.name "GitHub Actions"
          git config user.email "github-actions@mintwalk.com"

          git add .
          git commit -m "Sync from GitHub (live)" || echo "No changes to commit"

          git push origin live --force
